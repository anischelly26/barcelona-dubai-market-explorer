services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: market_explorer
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    ports:
      - "5432:5432"
    volumes:
      - market-db:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market_explorer"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MARKET_DATABASE_URL: postgresql+asyncpg://market:market@database:5432/market_explorer
      MARKET_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.jobs.daily_ingestion"]
    environment:
      MARKET_DATABASE_URL: postgresql+asyncpg://market:market@database:5432/market_explorer
      MARKET_INGESTION_SOURCE_URL: ${MARKET_INGESTION_SOURCE_URL:-}
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  market-db:
